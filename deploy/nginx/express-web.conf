# 放入 Nginx http 上下文（例如 sites-enabled），替换域名和证书路径。
limit_req_zone $binary_remote_addr zone=express_web_login:10m rate=10r/m;
server {
    listen 80;
    server_name express.example.com;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name express.example.com;
    ssl_certificate /etc/letsencrypt/live/express.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/express.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    location = /api/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }
    location ^~ /api/ws/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location = /api/auth/login {
        limit_req zone=express_web_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Connection "";
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        add_header Cache-Control no-store always;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
    }
}
